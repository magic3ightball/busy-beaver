<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모던 레퍼런스</title>
<style>
:root {
  --bg: #f2f0eb; --fg: #1d1f24; --muted: #6a6e78; --card: #ffffff; --line: #dedad0;
  --chip: #e7e3d9; --accent: #e0661b; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --fg: #e8e6e0; --muted: #9a9ea8; --card: #1a1d23; --line: #2b2f38;
    --chip: #242831; --accent: #ff9147; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --fg: #e8e6e0; --muted: #9a9ea8; --card: #1a1d23; --line: #2b2f38;
  --chip: #242831; --accent: #ff9147; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.65 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 20px 120px; }
header h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.01em; }
header p { color: var(--muted); margin: 4px 0; max-width: 760px; }
nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); padding: 10px 0; margin: 18px 0 8px; display: flex; gap: 8px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--fg); background: var(--chip); padding: 5px 12px;
  border-radius: 999px; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
nav a i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
section { margin-top: 56px; scroll-margin-top: 60px; }
.mood-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end;
  border-top: 1px solid var(--line); padding-top: 22px; }
.mood-head h2 { margin: 0; font-size: 1.45rem; }
.mood-head .en { color: var(--muted); font-size: .85rem; font-weight: 400; margin-left: 8px; letter-spacing: .04em; }
.mood-head p { grid-column: 1 / -1; margin: 0; color: var(--muted); max-width: 820px; }
.swatches { display: flex; gap: 4px; }
.swatches span { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08);
  font-size: 9px; display: flex; align-items: flex-end; justify-content: center; color: rgba(0,0,0,.45); padding-bottom: 2px; }
.ours { display: grid; grid-template-columns: minmax(0, 560px); gap: 14px; margin: 18px 0 10px; align-items: stretch; }
.ours figure, .ours .note { margin: 0; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  border: 1px solid var(--line); }
.ours img { width: 100%; height: 100%; max-height: 300px; object-fit: cover; display: block; cursor: zoom-in; }
.ours .note { padding: 14px 16px; font-size: .9rem; }
.ours .note b { display: block; font-size: .78rem; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.ours .note ul { margin: 6px 0 0; padding-left: 18px; }
.ours .note .tag { display: inline-block; font-size: .78rem; background: var(--chip); border-radius: 4px; padding: 0 6px; margin: 2px 2px 0 0; }
.grid { columns: 3 300px; column-gap: 14px; margin-top: 14px; }
.card { break-inside: avoid; margin: 0 0 14px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
.card img { width: 100%; min-height: 140px; display: block; cursor: zoom-in; background: var(--chip); }
.card .body { padding: 10px 14px 12px; }
.card h3 { font-size: .98rem; margin: 0; line-height: 1.35; }
.card .by { font-size: .8rem; color: var(--muted); margin: 2px 0 6px; }
.card .by a { color: inherit; }
.card .take { font-size: .86rem; margin: 0; }
.card .id { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font: 600 11px/1 ui-monospace, Menlo, monospace;
  padding: 4px 6px; border-radius: 4px; }
.heart { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgba(255,255,255,.9); cursor: pointer; font-size: 17px; line-height: 34px; color: #b8b2a6; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.heart[aria-pressed="true"] { color: #e0365b; }
.picked { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 9; background: var(--fg); color: var(--bg);
  border-radius: 999px; padding: 8px 10px 8px 18px; display: none; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  max-width: calc(100vw - 32px); font-size: .9rem; }
.picked.on { display: flex; }
.picked code { font: 12px ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52vw; }
.picked button { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: #fff; cursor: pointer; font-size: .85rem; }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; cursor: zoom-out; }
.lb.on { display: flex; }
.lb img { max-width: 100%; max-height: 92vh; border-radius: 6px; }
footer { margin-top: 72px; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: .85rem; }
footer a { color: inherit; }
@media (max-width: 760px) {
  .ours { grid-template-columns: 1fr 1fr; }
  .ours .note { grid-column: 1 / -1; }
  .mood-head { grid-template-columns: 1fr; }
  .swatches span { width: 28px; height: 28px; }
  header h1 { font-size: 1.5rem; }
  nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  nav a { white-space: nowrap; flex: none; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Busy Beaver 사이트 — 모던 레퍼런스</h1>
  <p>'모던하게'를 세 방향으로 나눠 레퍼런스 11장만 골랐어요. 방향 하나(또는 카드 몇 장)를 고르면 그걸로 사이트를 다시 만듭니다.</p>
  <p>마음에 드는 카드는 ♥를 누르세요. 아래에 나오는 번호 목록을 복사해 채팅에 붙여 주면 그 방향으로 고칠게요. 사진을 누르면 크게 볼 수 있어요.</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>
  <p>화면은 2026-10-20에 각 사이트에서 캡처한 개인 참고용 사본이고, 저작권은 각 사이트에 있어요. 이 폴더는 배포되는 <code>web/</code>에 들어가지 않습니다. 이전 무드 보드는 <a href="index.html">여기</a>.</p>
</footer>
</div>
<div class="picked" id="picked"><span>고른 것</span><code id="pickedList"></code><button id="copy" type="button">복사</button></div>
<div class="lb" id="lb"><img alt=""></div>
<script>
const MOODS = [
 { key: "dark", name: "다크 프로덕트", en: "DARK PRODUCT", dot: "#5e6ad2",
   desc: "Linear·Raycast처럼 거의 검은 바탕, 아주 얇은 회색 선, 큰 산세리프 제목, 한 가지 포인트 색. 우리 기계 그림(어두운 바탕)이 화면에 자연스럽게 녹아요.",
   sw: ["#08090a", "#151618", "#2a2c30", "#8a8f98", "#f7f8f8", "#5e6ad2"],
   good: ["기계 그림·시뮬레이터가 가장 돋보임", "숫자·코드가 많은 페이지와 잘 맞음"],
   bad: ["긴 한국어 설명은 어두운 바탕에서 조금 피곤할 수 있음"],
   type: ["Inter / Pretendard, 제목은 굵고 자간 좁게"] },
 { key: "light", name: "밝은 미니멀", en: "LIGHT MINIMAL", dot: "#111111",
   desc: "Vercel·Stripe·Anthropic 연구 글처럼 흰 바탕, 넓은 여백, 큰 제목, 장식 없는 그리드. 그림은 둥근 모서리 카드 안에 넣어요.",
   sw: ["#ffffff", "#fafafa", "#eaeaea", "#666666", "#111111", "#0070f3"],
   good: ["가장 깔끔하고 읽기 편함", "어떤 그림 색과도 충돌하지 않음"],
   bad: ["개성이 덜해 '평범한 사이트'처럼 보일 위험"],
   type: ["Inter / Pretendard, 숫자는 고정폭(Geist Mono 등)"] },
 { key: "explain", name: "모던 인터랙티브 해설", en: "INTERACTIVE EXPLAINER", dot: "#f59e0b",
   desc: "samwho·Josh Comeau·Ciechanowski처럼 글 한 줄 사이사이에 직접 만져 보는 위젯이 들어가요. 밝은 바탕에 부드러운 색, 위젯은 진한 카드.",
   sw: ["#f8fafc", "#ffffff", "#e2e8f0", "#475569", "#0f172a", "#f59e0b"],
   good: ["방금 만든 시뮬레이터를 페이지 곳곳에 작게 넣기 좋음", "어려운 개념을 단계별로 보여 주기 좋음"],
   bad: ["위젯을 여러 개 만들어야 해서 작업이 가장 큼"],
   type: ["둥근 산세리프 본문 + 고정폭 코드"] },
];
const REFS = {
 dark: [
  ["linear", "Linear — 첫 화면", "linear.app", "https://linear.app/", "검은 바탕에 큰 흰 제목, 아래로 얇은 선의 와이어프레임 그림. 우리 첫 화면에 기계 그림 하나를 크게 두는 구성."],
  ["linear-2", "Linear — 제품 화면", "linear.app", "https://linear.app/", "회색 단계만으로 만든 층(바탕·카드·선). 시뮬레이터 패널을 이렇게 만들면 깔끔해요."],
  ["raycast", "Raycast", "raycast.com", "https://www.raycast.com/", "어두운 바탕에 강한 색 그림 하나. 우리 시공간 다이어그램을 이렇게 '히어로'로."],
 ],
 light: [
  ["vercel", "Vercel", "vercel.com", "https://vercel.com/", "흰 바탕, 검은 도형 하나, 큰 글씨. 가장 단순한 모던."],
  ["stripe", "Stripe", "stripe.com", "https://stripe.com/", "흰 바탕 + 한쪽에 화려한 그라디언트. 기계 그림을 이 자리에 넣을 수 있어요."],
  ["anthropic-explainer", "Scaling Monosemanticity (연구 글)", "transformer-circuits.pub", "https://transformer-circuits.pub/2024/scaling-monosemanticity/", "연구 결과를 모던하게 보여 주는 글. 그림 옆에 짧은 설명, 회색 점 그림 + 주황 강조."],
  ["rauno", "Rauno Freiberg", "rauno.me", "https://rauno.me/", "큰 글자와 강한 단색 원 하나. 장식을 거의 안 쓰고 한 요소로 인상을 주는 방식."],
 ],
 explain: [
  ["samwho-2", "Memory Allocation", "Sam Rose (samwho.dev)", "https://samwho.dev/memory-allocation/", "글 사이에 칸 모양 위젯. 튜링 기계 테이프를 이렇게 보여 주면 딱 맞아요."],
  ["comeau-2", "An Interactive Guide to Flexbox", "Josh W. Comeau", "https://www.joshwcomeau.com/css/interactive-guide-to-flexbox/", "밝은 본문 + 진한 위젯 카드 + 오른쪽 목차. 긴 해설 페이지의 정석."],
  ["ciechanowski-gps", "GPS", "Bartosz Ciechanowski", "https://ciechanow.ski/gps/", "어두운 3D 위젯과 흰 본문의 대비. 본문 속 색 단어가 그림 속 색과 연결돼요."],
  ["quanta", "With Fifth Busy Beaver… (Quanta Magazine)", "Quanta Magazine", "https://www.quantamagazine.org/amateur-mathematicians-find-fifth-busy-beaver-turing-machine-20240702/", "같은 주제를 다룬 모던 과학 기사. 큰 일러스트 + 깔끔한 세리프 제목."],
 ],
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let picked = [];
try { picked = JSON.parse(localStorage.getItem("bb-modern-picks") || "[]"); } catch (e) { picked = []; }
const save = () => { try { localStorage.setItem("bb-modern-picks", JSON.stringify(picked)); } catch (e) {} };
$("#nav").innerHTML = MOODS.map(m => `<a href="#${m.key}"><i style="background:${m.dot}"></i>${esc(m.name)}</a>`).join("");
$("#main").innerHTML = MOODS.map((m, mi) => {
  const cards = REFS[m.key].map((r, j) => {
    const id = `${mi + 1}-${j + 1}`;
    return `<article class="card" data-id="${id}" data-title="${esc(r[1])}">
      <span class="id">${id}</span>
      <button class="heart" type="button" aria-pressed="false" aria-label="${esc(r[1])} 고르기">♥</button>
      <img src="modern/${r[0]}.jpg" alt="${esc(r[1])}" loading="lazy">
      <div class="body"><h3>${esc(r[1])}</h3><p class="by"><a href="${r[3]}" target="_blank" rel="noopener">${esc(r[2])} ↗</a></p><p class="take">${esc(r[4])}</p></div>
    </article>`;
  }).join("");
  return `<section id="${m.key}">
    <div class="mood-head"><h2>${mi + 1}. ${esc(m.name)}<span class="en">${m.en}</span></h2>
      <div class="swatches">${m.sw.map((c, i) => `<span style="background:${c}" title="${c}">${i === 0 ? "바탕" : i === m.sw.length - 1 ? "헤드" : ""}</span>`).join("")}</div>
      <p>${esc(m.desc)}</p></div>
    <div class="ours">
      <div class="note"><b>우리 사이트에 쓰면</b>
        <ul>${m.good.map(g => `<li>${esc(g)}</li>`).join("")}${m.bad.map(g => `<li style="color:var(--muted)">주의: ${esc(g)}</li>`).join("")}</ul>
        <div style="margin-top:8px">${m.type.map(t => `<span class="tag">글꼴: ${esc(t)}</span>`).join("")}</div>
        <button class="heart" type="button" aria-pressed="false" data-mood="${mi + 1}" style="position:static;margin-top:10px;width:auto;padding:0 12px;border-radius:999px;font-size:.85rem;line-height:30px;height:30px" aria-label="이 방향 고르기">♥ 이 방향</button>
      </div>
    </div>
    <div class="grid">${cards}</div>
  </section>`;
}).join("");
function keyOf(btn) { return btn.dataset.mood ? `방향${btn.dataset.mood}` : btn.closest(".card").dataset.id; }
function sync() {
  document.querySelectorAll(".heart").forEach(b => b.setAttribute("aria-pressed", picked.includes(keyOf(b)) ? "true" : "false"));
  $("#picked").classList.toggle("on", picked.length > 0);
  $("#pickedList").textContent = picked.join(", ");
}
document.addEventListener("click", e => {
  const h = e.target.closest(".heart");
  if (h) { const k = keyOf(h); picked = picked.includes(k) ? picked.filter(x => x !== k) : [...picked, k]; save(); sync(); return; }
  const img = e.target.closest(".card img, .ours img");
  if (img) { $("#lb img").src = img.src; $("#lb").classList.add("on"); return; }
  if (e.target.closest("#lb")) $("#lb").classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").classList.remove("on"); });
$("#copy").addEventListener("click", async () => {
  const text = "모던 레퍼런스에서 고른 것: " + picked.map(k => {
    const c = document.querySelector(`.card[data-id="${k}"]`); return c ? `${k} ${c.dataset.title}` : k;
  }).join(", ");
  try { await navigator.clipboard.writeText(text); $("#copy").textContent = "복사됨"; } catch (e) { prompt("복사해 주세요", text); }
  setTimeout(() => $("#copy").textContent = "복사", 1500);
});
sync();
</script>
</body>
</html>
